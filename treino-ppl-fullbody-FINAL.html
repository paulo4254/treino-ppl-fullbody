<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<title>Treino PPL + Full Body</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#14161A;color:#F2F0EA;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
button,input{font:inherit}.wrap{min-height:100vh}
.header{padding:28px 20px 14px}.brand{display:flex;align-items:center;gap:9px;color:#8A8D93;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.brand b{color:#D4A72C;font-size:20px}.title{font-size:32px;font-weight:800;margin:5px 0}.sub{color:#8A8D93;font-size:14px}
.days{padding:16px 20px 40px;display:flex;flex-direction:column;gap:12px}
.day{position:relative;text-align:left;width:100%;background:#1D2025;border:1px solid #2A2D33;border-radius:16px;padding:20px;color:#F2F0EA;cursor:pointer;overflow:hidden}
.bar{position:absolute;left:0;top:0;width:5px;height:100%}.daytop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dayname{font-size:20px;font-weight:750}.focus{font-size:14px;color:#8A8D93;margin-top:3px}.count{font-size:12px;border-radius:999px;padding:4px 10px;font-weight:700}
.rest{margin-top:8px;padding:15px;border:1px dashed #2A2D33;border-radius:16px;color:#8A8D93;font-size:13px}
.top{padding:22px 20px 16px;border-bottom:1px solid #2A2D33}.back{border:0;background:none;color:#8A8D93;padding:0;margin:0 0 13px;cursor:pointer}
.toprow{display:flex;justify-content:space-between;align-items:end;gap:10px}.workout-title{font-size:26px;font-weight:800;margin:0}
.focus2{font-size:13px;font-weight:700;margin-top:4px}.donecount{color:#8A8D93;font-size:13px}
.list{padding:16px 20px 60px;display:flex;flex-direction:column;gap:12px}.card{background:#1D2025;border:1px solid #2A2D33;border-radius:16px;padding:16px}
.card.done{opacity:.7}.meta{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800}.exname{font-size:16px;font-weight:750;margin-top:3px}
.sets{font-size:13px;color:#8A8D93;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.row{display:flex;gap:8px;margin-top:12px}
.load{flex:1;background:#14161A;border:1px solid #2A2D33;border-radius:10px;padding:9px 12px;color:#F2F0EA;outline:none;min-width:0}
.watch{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.check{width:32px;height:32px;border-radius:50%;border:1.5px solid #3A3D43;background:transparent;color:#14161A;float:right;cursor:pointer}.check.on{color:#14161A}
.clear{display:block;margin:0 20px 25px;border:1px solid #33373e;background:#1D2025;color:#8A8D93;border-radius:10px;padding:9px 12px;font-size:12px}
#videoModal{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.video-box{width:100%;max-width:760px}.video-close{float:right;border:0;color:white;border-radius:10px;padding:10px 15px;margin-bottom:10px;font-weight:700;font-size:14px;cursor:pointer}
.video-frame{clear:both;position:relative;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:420px){.row{flex-direction:column}.watch{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DIAS=[
{id:"segunda",label:"Segunda",foco:"Peito · Ombros · Tríceps",cor:"#E8542A",exercicios:[
["Supino reto com barra","4×6–8","Peito"],
["Supino inclinado com halteres","3×8–10","Peito"],
["Crucifixo na polia","3×10–15","Peito"],
["Desenvolvimento com halteres","3×8–10","Ombro"],
["Elevação lateral","3×12–15","Ombro"],
["Tríceps testa","3×8–10","Tríceps"],
["Tríceps corda","3×10–12","Tríceps"],
["Reverse Pec Deck","3×12–15","Ombro"]]},
{id:"terca",label:"Terça",foco:"Costas · Bíceps · Trapézio",cor:"#2A9D8F",exercicios:[
["Remada articulada com apoio no peito","4×8–10","Costas"],
["Remada cavalinho","4×8–10","Costas"],
["Puxada neutra","3×8–10","Costas"],
["Remada unilateral","3×10–12","Costas"],
["Encolhimento","3×10–12","Trapézio"],
["Rosca inclinada","3×8–10","Bíceps"],
["Rosca martelo","3×10–12","Bíceps"],
["Abdômen","3 séries","Core"]]},
{id:"quarta",label:"Quarta",foco:"Pernas completas",cor:"#5B5FE9",exercicios:[
["Hack Squat","4×6–8","Quadríceps"],
["Leg Press","3×10–12","Quadríceps"],
["RDL pesado","3×8–10","Posterior"],
["Mesa flexora","3×10–12","Posterior"],
["Cadeira extensora","3×12–15","Quadríceps"],
["Panturrilha em pé","4×10–15","Panturrilha"],
["Panturrilha sentada","3×12–15","Panturrilha"],
["Abdutora","3×12–15","Glúteo"]]},
{id:"sexta",label:"Sexta",foco:"Full Body",cor:"#D4A72C",exercicios:[
["Hack Squat leve / Agachamento frontal","3×8–10","Quadríceps"],
["Supino inclinado","3×8–10","Peito"],
["Puxada neutra / Barra fixa","3×8–10","Costas"],
["RDL leve/moderado","3×8–10","Posterior"],
["Desenvolvimento com halteres","2×10–12","Ombro"],
["Rosca Scott","3×10–12","Bíceps"],
["Tríceps corda","3×10–12","Tríceps"],
["Panturrilha","3×12–15","Panturrilha"]]}
];

const VIDEOS={
"Supino reto com barra":"https://www.youtube.com/watch?v=WwXS2TeFmeg",
"Supino inclinado com halteres":"https://www.youtube.com/watch?v=b9yWOPLO_CQ",
"Reverse Pec Deck":"https://www.youtube.com/watch?v=Z84HkxGCBqQ",
"Rosca inclinada":"https://www.youtube.com/watch?v=dblHmK_rFQ4",
"Rosca martelo":"https://www.youtube.com/watch?v=zJgwwvS2pBc",
"Cadeira extensora":"https://www.youtube.com/watch?v=JJnyfrUJgf0"
};

let active=null;
const loads=JSON.parse(localStorage.getItem("treino-cargas")||"{}");
const done=JSON.parse(localStorage.getItem("treino-feitos")||"{}");
const key=(d,n)=>d+"|"+n;

function save(){
localStorage.setItem("treino-cargas",JSON.stringify(loads));
localStorage.setItem("treino-feitos",JSON.stringify(done));
}

function searchUrl(nome){
return "https://www.youtube.com/results?search_query="+encodeURIComponent(nome+" execução correta exercício");
}

function openVideo(nome,cor){
const url=VIDEOS[nome];
if(!url){
window.open(searchUrl(nome),"_blank");
return;
}

const id=new URL(url).searchParams.get("v");
if(!id){window.open(url,"_blank");return;}

const old=document.getElementById("videoModal");
if(old)old.remove();

const modal=document.createElement("div");
modal.id="videoModal";
modal.innerHTML=`
<div class="video-box">
<button class="video-close" style="background:${cor}" onclick="closeVideo()">✕ Fechar</button>
<div class="video-frame">
<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0"
title="${nome}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>
</div>`;
document.body.appendChild(modal);
}

function closeVideo(){
const modal=document.getElementById("videoModal");
if(modal)modal.remove();
}

function render(){
const app=document.getElementById("app");

if(!active){
app.innerHTML=`
<div class="wrap">
<div class="header">
<div class="brand"><b>◉</b> Semana de treino</div>
<div class="title">PPL + Full Body</div>
<div class="sub">4 dias · 8 exercícios por sessão · seg / ter / qua / sex</div>
</div>
<div class="days">
${DIAS.map(d=>`
<button class="day" onclick="openDay('${d.id}')">
<span class="bar" style="background:${d.cor}"></span>
<div class="daytop">
<div><div class="dayname">${d.label}</div><div class="focus">${d.foco}</div></div>
<span class="count" style="color:${d.cor};border:1px solid ${d.cor}55">${d.exercicios.length} exercícios</span>
</div>
</button>`).join("")}
<div class="rest">Quinta, sábado e domingo — folga</div>
</div>
</div>`;
return;
}

const d=DIAS.find(x=>x.id===active);
const n=done[d.id]?Object.values(done[d.id]).filter(Boolean).length:0;

app.innerHTML=`
<div class="wrap">
<div class="top">
<button class="back" onclick="back()">‹ Semana</button>
<div class="toprow">
<div><div class="workout-title">${d.label}</div><div class="focus2" style="color:${d.cor}">${d.foco}</div></div>
<div class="donecount">${n}/${d.exercicios.length} feitos</div>
</div>
</div>
<div class="list">
${d.exercicios.map((e,i)=>{
const k=key(d.id,e[0]);
const is=!!done[d.id]?.[e[0]];
return `
<div class="card ${is?"done":""}">
<button class="check ${is?"on":""}" style="${is?`background:${d.cor};border-color:${d.cor}`:""}" onclick="toggle('${d.id}',${i})">${is?"✓":""}</button>
<div class="meta" style="color:${d.cor}">${e[2]}</div>
<div class="exname">${e[0]}</div>
<div class="sets">${e[1]}</div>
<div class="row">
<input class="load" inputmode="decimal" placeholder="Última carga (kg)" value="${loads[k]||""}" oninput="setLoad('${d.id}',${i},this.value)">
<button class="watch" style="color:${d.cor};border-color:${d.cor}" onclick="openVideo(${JSON.stringify(e[0])},'${d.cor}')">▶ Execução</button>
</div>
</div>`;
}).join("")}
</div>
<button class="clear" onclick="clearDone()">Limpar marcações do dia</button>
</div>`;
}

function openDay(id){active=id;render()}
function back(){active=null;render()}

function toggle(id,i){
const e=DIAS.find(x=>x.id===id).exercicios[i][0];
done[id]??={};
done[id][e]=!done[id][e];
save();
render();
}

function setLoad(id,i,v){
const e=DIAS.find(x=>x.id===id).exercicios[i][0];
loads[key(id,e)]=v;
save();
}

function clearDone(){
delete done[active];
save();
render();
}

render();
</script>
</body>
</html>
