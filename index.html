<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<title>Treino PPL + Full Body</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#14161A;color:#F2F0EA;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
button,input{font:inherit}
.wrap{min-height:100vh}
.header{padding:28px 20px 14px}
.brand{display:flex;align-items:center;gap:9px;color:#8A8D93;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.brand b{color:#D4A72C;font-size:20px}
.title{font-size:32px;font-weight:800;margin:5px 0}
.sub{color:#8A8D93;font-size:14px}
.days{padding:16px 20px 40px;display:flex;flex-direction:column;gap:12px}
.day{position:relative;text-align:left;width:100%;background:#1D2025;border:1px solid #2A2D33;border-radius:16px;padding:20px;color:#F2F0EA;cursor:pointer;overflow:hidden}
.bar{position:absolute;left:0;top:0;width:5px;height:100%}
.daytop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dayname{font-size:20px;font-weight:750}
.focus{font-size:14px;color:#8A8D93;margin-top:3px}
.count{font-size:12px;border-radius:999px;padding:4px 10px;font-weight:700}
.rest{margin-top:8px;padding:15px;border:1px dashed #2A2D33;border-radius:16px;color:#8A8D93;font-size:13px}
.top{padding:22px 20px 16px;border-bottom:1px solid #2A2D33}
.back{border:0;background:none;color:#8A8D93;padding:0;margin:0 0 13px;cursor:pointer}
.toprow{display:flex;justify-content:space-between;align-items:end;gap:10px}
.workout-title{font-size:26px;font-weight:800;margin:0}
.focus2{font-size:13px;font-weight:700;margin-top:4px}
.donecount{color:#8A8D93;font-size:13px}
.list{padding:16px 20px 60px;display:flex;flex-direction:column;gap:12px}
.card{background:#1D2025;border:1px solid #2A2D33;border-radius:16px;padding:16px}
.card.done{opacity:.7}
.meta{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800}
.exname{font-size:16px;font-weight:750;margin-top:3px}
.sets{font-size:13px;color:#8A8D93;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.row{display:flex;gap:8px;margin-top:12px}
.load{flex:1;min-width:0;background:#14161A;border:1px solid #2A2D33;border-radius:10px;padding:9px 12px;color:#F2F0EA;outline:none}
.watch{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.check{width:32px;height:32px;border-radius:50%;border:1.5px solid #3A3D43;background:transparent;color:#14161A;float:right;cursor:pointer}
.check.on{color:#14161A}
.clear{display:block;margin:0 20px 25px;border:1px solid #33373e;background:#1D2025;color:#8A8D93;border-radius:10px;padding:9px 12px;font-size:12px}
@media(max-width:520px){
  .row{align-items:stretch}
  .watch{padding:9px 10px;white-space:nowrap}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DIAS=[
{id:"segunda",label:"Segunda",foco:"Peito · Ombros · Tríceps",cor:"#E8542A",exercicios:[
["Supino reto com barra","4×6–8","Peito","supino reto com barra execução correta"],
["Supino inclinado com halteres","3×8–10","Peito","supino inclinado com halteres execução"],
["Crucifixo na polia","3×10–15","Peito","crucifixo na polia cable fly execução"],
["Desenvolvimento com halteres","3×8–10","Ombro","desenvolvimento com halteres execução"],
["Elevação lateral","3×12–15","Ombro","elevação lateral execução correta"],
["Tríceps testa","3×8–10","Tríceps","tríceps testa execução correta"],
["Tríceps corda","3×10–12","Tríceps","tríceps corda pulley execução"],
["Reverse Pec Deck","3×12–15","Ombro","reverse pec deck execução"]]},
{id:"terca",label:"Terça",foco:"Costas · Bíceps · Trapézio",cor:"#2A9D8F",exercicios:[
["Remada articulada com apoio no peito","4×8–10","Costas","remada articulada apoio no peito execução"],
["Remada cavalinho","4×8–10","Costas","remada cavalinho t-bar row execução"],
["Puxada neutra","3×8–10","Costas","puxada neutra execução correta"],
["Remada unilateral","3×10–12","Costas","remada unilateral halter execução"],
["Encolhimento","3×10–12","Trapézio","encolhimento para trapézio execução"],
["Rosca inclinada","3×8–10","Bíceps","rosca inclinada execução correta"],
["Rosca martelo","3×10–12","Bíceps","rosca martelo execução correta"],
["Abdômen","3 séries","Core","abdômen execução correta"]]},
{id:"quarta",label:"Quarta",foco:"Pernas completas",cor:"#5B5FE9",exercicios:[
["Hack Squat","4×6–8","Quadríceps","hack squat execução correta"],
["Leg Press","3×10–12","Quadríceps","leg press execução correta"],
["RDL pesado","3×8–10","Posterior","RDL stiff romeno execução correta"],
["Mesa flexora","3×10–12","Posterior","mesa flexora execução correta"],
["Cadeira extensora","3×12–15","Quadríceps","cadeira extensora execução correta"],
["Panturrilha em pé","4×10–15","Panturrilha","panturrilha em pé execução correta"],
["Panturrilha sentada","3×12–15","Panturrilha","panturrilha sentada execução correta"],
["Abdutora","3×12–15","Glúteo","cadeira abdutora execução correta"]]},
{id:"sexta",label:"Sexta",foco:"Full Body",cor:"#D4A72C",exercicios:[
["Hack Squat leve / Agachamento frontal","3×8–10","Quadríceps","agachamento frontal execução correta"],
["Supino inclinado","3×8–10","Peito","supino inclinado execução correta"],
["Puxada neutra / Barra fixa","3×8–10","Costas","barra fixa execução correta"],
["RDL leve/moderado","3×8–10","Posterior","RDL execução correta"],
["Desenvolvimento com halteres","2×10–12","Ombro","desenvolvimento com halteres execução"],
["Rosca Scott","3×10–12","Bíceps","rosca scott execução correta"],
["Tríceps corda","3×10–12","Tríceps","tríceps corda pulley execução"],
["Panturrilha","3×12–15","Panturrilha","panturrilha em pé execução correta"]]}
];

/* Vídeos específicos já confirmados/fornecidos */
const VIDEOS={
"Supino reto com barra":"https://www.youtube.com/watch?v=tA0eM3AFf1g",
"Supino inclinado com halteres":"https://www.youtube.com/watch?v=b9yWOPLO_CQ",
"Desenvolvimento com halteres":"https://www.youtube.com/watch?v=MmHTcVK-1tU",
"Tríceps corda":"https://www.youtube.com/watch?v=wLCzocH0SoI",
"Remada cavalinho":"https://www.youtube.com/watch?v=T_lUbPfCf6Y",
"Remada unilateral":"https://www.youtube.com/watch?v=f84ghOx_wnY"
};

let active=null;
const loads=JSON.parse(localStorage.getItem("treino-cargas")||"{}");
const done=JSON.parse(localStorage.getItem("treino-feitos")||"{}");
const key=(d,n)=>d+"|"+n;

function save(){
  localStorage.setItem("treino-cargas",JSON.stringify(loads));
  localStorage.setItem("treino-feitos",JSON.stringify(done));
}

function render(){
  const app=document.getElementById("app");

  if(!active){
    app.innerHTML=`<div class="wrap">
      <div class="header">
        <div class="brand"><b>◉</b> Semana de treino</div>
        <div class="title">PPL + Full Body</div>
        <div class="sub">4 dias · 8 exercícios por sessão · seg / ter / qua / sex</div>
      </div>
      <div class="days">
        ${DIAS.map(d=>`<button class="day" onclick="openDay('${d.id}')">
          <span class="bar" style="background:${d.cor}"></span>
          <div class="daytop">
            <div><div class="dayname">${d.label}</div><div class="focus">${d.foco}</div></div>
            <span class="count" style="color:${d.cor};border:1px solid ${d.cor}55">${d.exercicios.length} exercícios</span>
          </div>
        </button>`).join("")}
        <div class="rest">Quinta, sábado e domingo — folga</div>
      </div>
    </div>`;
    return;
  }

  const d=DIAS.find(x=>x.id===active);
  const n=done[d.id]?Object.values(done[d.id]).filter(Boolean).length:0;

  app.innerHTML=`<div class="wrap">
    <div class="top">
      <button class="back" onclick="back()">‹ Semana</button>
      <div class="toprow">
        <div>
          <div class="workout-title">${d.label}</div>
          <div class="focus2" style="color:${d.cor}">${d.foco}</div>
        </div>
        <div class="donecount">${n}/${d.exercicios.length} feitos</div>
      </div>
    </div>

    <div class="list">
      ${d.exercicios.map((e,i)=>{
        const k=key(d.id,e[0]);
        const is=!!done[d.id]?.[e[0]];
        const video=VIDEOS[e[0]]||"";
        return `<div class="card ${is?"done":""}">
          <button class="check ${is?"on":""}" style="${is?`background:${d.cor};border-color:${d.cor}`:""}" onclick="toggle('${d.id}',${i})">${is?"✓":""}</button>
          <div class="meta" style="color:${d.cor}">${e[2]}</div>
          <div class="exname">${e[0]}</div>
          <div class="sets">${e[1]}</div>
          <div class="row">
            <input class="load" inputmode="decimal" placeholder="Última carga (kg)" value="${loads[k]||""}" oninput="setLoad('${d.id}',${i},this.value)">
            ${VIDEOS[e[0]]
  ? `<a class="watch" style="color:${d.cor};border-color:${d.cor}" href="${VIDEOS[e[0]]}" target="_blank" rel="noopener noreferrer">▶ Ver vídeo</a>`
  : `<a class="watch" style="color:${d.cor};border-color:${d.cor}" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[3])}" target="_blank" rel="noopener noreferrer">▶ Procurar vídeo</a>`}
          </div>
        </div>`;
      }).join("")}
    </div>

    <button class="clear" onclick="clearDone()">Limpar marcações do dia</button>
  </div>`;
}

function openDay(id){active=id;render()}
function back(){active=null;render()}

function toggle(id,i){
  const e=DIAS.find(x=>x.id===id).exercicios[i][0];
  done[id]??={};
  done[id][e]=!done[id][e];
  save();
  render();
}

function setLoad(id,i,v){
  const e=DIAS.find(x=>x.id===id).exercicios[i][0];
  loads[key(id,e)]=v;
  save();
}

function clearDone(){
  delete done[active];
  save();
  render();
}


render();
</script>
</body>
</html>
